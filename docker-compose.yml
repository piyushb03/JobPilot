version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilotpassword
      POSTGRES_DB: jobpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://jobpilot:jobpilotpassword@db:5432/jobpilot
      - PORT=8000
      - USE_MOCK_AI=true
    depends_on:
      - db

volumes:
  postgres_data:
